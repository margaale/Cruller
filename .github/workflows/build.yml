# Builds Cruller for every board and runs the host tests. One job per platform (its toolchain), with
# a matrix of that platform's boards; the images are kept as artifacts, one file each (not zipped).
# Each board publishes two: the factory image, to install on a new board over USB, and the OTA image,
# which the board's Cruller tab downloads to update itself.
# GitVersion (GitVersion.yml) gives the version. A push to master is a release (vX.Y.Z), a push to develop
# a pre-release (vX.Y.Z-alpha.N), both with every board's images; pull requests only build.
name: build

on:
  push:
    branches: [master, develop] # pull requests build through pull_request (one run per push, not two)
  pull_request:
  workflow_dispatch:

env:
  # The same versions as local builds (scripts/build.sh's tools): a CI image and a local build of the
  # same commit are then built alike. Update both together.
  PICO_SDK_VERSION: "2.3.1"
  PICOTOOL_VERSION: "2.3.1"
  TINYUSB_VERSION: "0.21.0"
  FREERTOS_KERNEL_REF: "4f7299d6ea746b27a9dd19e87af568e34bd65b15" # raspberrypi/FreeRTOS-Kernel
  ARM_GCC_RELEASE: "15.3.Rel2"
  ESP_IDF_VERSION: "v6.1"
  NODE_VERSION: "24"
  ESBUILD_VERSION: "0.28.2" # scripts/minify-web.sh, which minifies the page for the images: its JavaScript
  HTML_MINIFIER_VERSION: "7.2.0" # ... and its index.html

jobs:
  # src/core's pure modules and the page's JavaScript, on the host: the same for every board.
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true # littlefs, for cfgfs's tests
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: bash tests/run.sh
      # The page minified, as the images embed it: its tests again, and check_page (each id app.js uses,
      # in index.html); not check_api, which reads the sources.
      - name: Tests on the minified page
        run: |
          bash scripts/minify-web.sh
          for t in editor mapper profiles sd fw gameid_page; do node tests/test_$t.js; done
          node tests/check_page.js

  # Raspberry Pi RP2 boards: Pico SDK, target src/platform/rp2.
  rp2:
    name: rp2 (${{ matrix.board }})
    outputs:
      version: ${{ steps.version.outputs.version }} # (the publish job's)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        board: [pico2_w]
    env:
      TOOLS: ${{ github.workspace }}/.tools
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # GitVersion reads the tags and the history
      - name: littlefs # (its history not: the checkout would take it all, with fetch-depth 0)
        run: git submodule update -q --init --depth 1

      - id: version
        uses: ./.github/actions/version

      # Compiles through ccache: its directory kept between runs, so only what changed is compiled again.
      # Nothing that changes with every run is on the compilers' command lines (src/core/version.c and
      # crt0 alone get the version), or every file would be new each time.
      - name: ccache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-rp2-${{ matrix.board }}-${{ github.sha }}
          restore-keys: ccache-rp2-${{ matrix.board }}-
      - name: ninja, ccache
        run: bash scripts/ci-tools.sh

      - name: Arm GNU toolchain
        id: arm
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: ${{ env.ARM_GCC_RELEASE }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Minify the page
        run: bash scripts/minify-web.sh

      # The Pico SDK (with the submodules the build uses: no Bluetooth), TinyUSB and FreeRTOS, cloned once
      # for their versions and kept between runs (the clones took 11-20 s). TinyUSB is kept as build.sh
      # patched it: an unchanged series is skipped, a new one applied again on a clean checkout.
      - name: Pico SDK, TinyUSB, FreeRTOS (cached)
        id: sdk-cache
        uses: actions/cache@v6
        with:
          path: |
            .tools/pico-sdk
            .tools/tinyusb
            .tools/FreeRTOS-Kernel
          key: pico-sdk-${{ env.PICO_SDK_VERSION }}-cyw43-lwip-mbedtls-tinyusb-${{ env.TINYUSB_VERSION }}-freertos-${{ env.FREERTOS_KERNEL_REF }}

      - name: Pico SDK, TinyUSB, FreeRTOS (clone)
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$TOOLS"
          git clone -q --depth 1 -b "$PICO_SDK_VERSION" https://github.com/raspberrypi/pico-sdk "$TOOLS/pico-sdk"
          git -C "$TOOLS/pico-sdk" submodule update -q --init --depth 1 lib/cyw43-driver lib/lwip lib/mbedtls
          git clone -q --depth 1 -b "$TINYUSB_VERSION" https://github.com/hathach/tinyusb "$TOOLS/tinyusb"
          git init -q "$TOOLS/FreeRTOS-Kernel"
          git -C "$TOOLS/FreeRTOS-Kernel" fetch -q --depth 1 https://github.com/raspberrypi/FreeRTOS-Kernel "$FREERTOS_KERNEL_REF"
          git -C "$TOOLS/FreeRTOS-Kernel" checkout -q FETCH_HEAD

      - name: picotool (cached)
        id: picotool-cache
        uses: actions/cache@v6
        with:
          path: .tools/picotool-install
          key: picotool-${{ env.PICOTOOL_VERSION }}-${{ runner.os }}

      - name: picotool (build)
        if: steps.picotool-cache.outputs.cache-hit != 'true'
        run: |
          git clone -q --depth 1 -b "$PICOTOOL_VERSION" https://github.com/raspberrypi/picotool "$TOOLS/picotool"
          cmake -S "$TOOLS/picotool" -B "$TOOLS/picotool/build" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPICO_SDK_PATH="$TOOLS/pico-sdk" -DPICOTOOL_NO_LIBUSB=1
          cmake --build "$TOOLS/picotool/build"
          cmake --install "$TOOLS/picotool/build" --prefix "$TOOLS/picotool-install"

      - name: Build
        env:
          CRULLER_VERSION: ${{ steps.version.outputs.version }}
          CRULLER_BUILD: ${{ github.run_number }}
          CRULLER_DEBUG: ${{ steps.version.outputs.debug }}
          PICO_BOARD: ${{ matrix.board }}
          PICO_SDK_PATH: ${{ env.TOOLS }}/pico-sdk
          FREERTOS_KERNEL_PATH: ${{ env.TOOLS }}/FreeRTOS-Kernel
          PICO_TINYUSB_PATH: ${{ env.TOOLS }}/tinyusb
          PICO_TOOLCHAIN_PATH: ${{ steps.arm.outputs.path }}
          PICOTOOL_DIR: ${{ env.TOOLS }}/picotool-install/lib/cmake/picotool
          PIOASM_DIR: ${{ env.TOOLS }}/pioasm # not there: the SDK builds pioasm itself
        run: |
          bash scripts/build.sh rp2 Release
          bash scripts/ci-tools.sh done

      # Named as released: cruller-<version>-<board>-<file>. cruller-factory.uf2 installs a new board
      # (BOOTSEL, then drop it on the drive); cruller.uf2 is the OTA image the Cruller tab looks for.
      - name: Name the images
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir dist
          for f in build/rp2/cruller-factory.uf2 build/rp2/cruller.uf2; do
            cp "$f" "dist/cruller-${VERSION}-${{ matrix.board }}-$(basename "$f")"
          done

      - uses: actions/upload-artifact@v7
        with:
          path: dist/cruller-${{ steps.version.outputs.version }}-${{ matrix.board }}-cruller-factory.uf2
          archive: false # the image itself, not a zip: the artifact takes the file's name
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          path: dist/cruller-${{ steps.version.outputs.version }}-${{ matrix.board }}-cruller.uf2
          archive: false # the image itself, not a zip: the artifact takes the file's name
          if-no-files-found: error

  # Espressif ESP32 boards: ESP-IDF on the runner (installed for the chip, kept between runs), target
  # src/platform/esp32.
  esp32:
    name: esp32 (${{ matrix.board }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        board: [esp32s3_devkitc1_n16r8]
    env:
      IDF_PATH: /home/runner/esp/esp-idf
      IDF_TOOLS_PATH: /home/runner/.espressif
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # GitVersion reads the tags and the history
      - name: littlefs # (cfgfs; its history not: the checkout would take it all, with fetch-depth 0)
        run: git submodule update -q --init --depth 1

      - id: version
        uses: ./.github/actions/version

      # It compiles through ccache: its directory kept between runs, so only what changed is compiled again.
      - name: ccache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-esp32-${{ matrix.board }}-${{ env.ESP_IDF_VERSION }}-${{ github.sha }}
          restore-keys: ccache-esp32-${{ matrix.board }}-${{ env.ESP_IDF_VERSION }}-
      - name: ninja, ccache
        run: bash scripts/ci-tools.sh

      # ESP-IDF with what building takes (the Xtensa compiler and its Python environment), installed once
      # and kept between runs: cheaper than pulling Espressif's image (every chip's tools) each time, which
      # took ~70 s. Not install.sh's other tools for the chip (its ULP's RISC-V compiler, the largest, gdb,
      # OpenOCD, clangd): IDF_SKIP_TOOLS_CHECK, below, lets export.sh go without them. Nor its git history,
      # examples and docs: version.txt gives its version instead, as in Espressif's release zips. The same
      # paths every run, as ccache wants them.
      - name: ESP-IDF (cached)
        id: idf-cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.IDF_PATH }}
            !${{ env.IDF_PATH }}/.git
            !${{ env.IDF_PATH }}/examples
            !${{ env.IDF_PATH }}/docs
            ${{ env.IDF_TOOLS_PATH }}
            !${{ env.IDF_TOOLS_PATH }}/dist
          key: esp-idf-${{ env.ESP_IDF_VERSION }}-esp32s3-only-${{ runner.os }} # (what install keeps)

      - name: ESP-IDF (install)
        if: steps.idf-cache.outputs.cache-hit != 'true'
        run: |
          git clone -q --depth 1 -b "$ESP_IDF_VERSION" --recursive --shallow-submodules https://github.com/espressif/esp-idf "$IDF_PATH"
          echo "$ESP_IDF_VERSION" > "$IDF_PATH/version.txt"
          python3 "$IDF_PATH/tools/idf_tools.py" --non-interactive install --targets=esp32s3 xtensa-esp-elf
          python3 "$IDF_PATH/tools/idf_tools.py" --non-interactive install-python-env
          # The compiler's libraries for the ESP32 and ESP32-S2 (newlib's and picolibc's): a third of the
          # cache, restored every run, never linked.
          cc="$IDF_TOOLS_PATH/tools/xtensa-esp-elf"
          rm -rf "$cc"/*/xtensa-esp-elf/{xtensa-esp-elf,picolibc/xtensa-esp-elf}/lib/{esp32,esp32s2} \
              "$cc"/*/xtensa-esp-elf/lib/gcc/xtensa-esp-elf/*/{esp32,esp32s2}
          du -sh "$IDF_PATH" "$IDF_TOOLS_PATH"

      # The ESP32's components (main/idf_component.yml) as dependencies.lock pins them, kept by it.
      - name: Components
        uses: actions/cache@v6
        with:
          path: src/platform/esp32/managed_components
          key: esp32-components-${{ hashFiles('src/platform/esp32/dependencies.lock') }}

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Minify the page
        run: bash scripts/minify-web.sh

      - name: Build
        env:
          CRULLER_VERSION: ${{ steps.version.outputs.version }}
          CRULLER_DEBUG: ${{ steps.version.outputs.debug }}
          IDF_SKIP_TOOLS_CHECK: 1 # (ESP-IDF's tools this build doesn't use aren't installed: above)
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          bash scripts/build.sh esp32
          bash scripts/ci-tools.sh done

      # Named as released: cruller-<version>-<board>-<file>. cruller-factory.bin installs a new board
      # over USB at 0x0 (bootloader, partition table, OTA data and app in one); cruller.bin is the OTA image.
      - name: Name the images
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir dist
          for f in build/esp32/cruller-factory.bin build/esp32/cruller.bin; do
            cp "$f" "dist/cruller-${VERSION}-${{ matrix.board }}-$(basename "$f")"
          done

      - uses: actions/upload-artifact@v7
        with:
          path: dist/cruller-${{ steps.version.outputs.version }}-${{ matrix.board }}-cruller-factory.bin
          archive: false # the image itself, not a zip: the artifact takes the file's name
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          path: dist/cruller-${{ steps.version.outputs.version }}-${{ matrix.board }}-cruller.bin
          archive: false # the image itself, not a zip: the artifact takes the file's name
          if-no-files-found: error

  # Every push to master: tag vX.Y.Z and a GitHub release with every board's images; to develop, a
  # pre-release vX.Y.Z-alpha.N, to try on a board (the Cruller tab offers alphas only to a board already on
  # one).
  publish:
    if: github.event_name == 'push'
    needs: [tests, rp2, esp32]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: cruller-*
          path: release
          merge-multiple: true # every board's images in one place, already named
      - run: ls -l release
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.rp2.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Cruller ${{ needs.rp2.outputs.version }}
          generate_release_notes: true
          prerelease: ${{ github.ref != 'refs/heads/master' }}
          files: release/*
          fail_on_unmatched_files: true

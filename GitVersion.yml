# Cruller's version (.github/workflows/build.yml): every push to main is a release, tagged vX.Y.Z, and
# the patch grows with each one. A line "+semver: minor" or "+semver: major" in a commit message
# bumps more; only at the start of a line, so a message that merely mentions them doesn't.
# The version must only grow: the Pico 2 W's boot ROM picks its A/B slot by it.
workflow: GitHubFlow/v1
next-version: 0.3.0
tag-prefix: '[vV]?'
major-version-bump-message: '(?m)^\s*\+semver:\s?(breaking|major)\b'
minor-version-bump-message: '(?m)^\s*\+semver:\s?(feature|minor)\b'
patch-version-bump-message: '(?m)^\s*\+semver:\s?(fix|patch)\b'
no-bump-message: '(?m)^\s*\+semver:\s?(none|skip)\b'
